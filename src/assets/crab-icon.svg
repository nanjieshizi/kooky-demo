<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Background: rounded rect with soft gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>
  <rect x="16" y="16" width="992" height="992" rx="208" ry="208" fill="none" stroke="#fda4af" stroke-width="6"/>

  <!-- Crab scaled up ~7x and centered -->
  <g transform="translate(92, 72) scale(7)">
    <!-- Body -->
    <ellipse cx="60" cy="65" rx="32" ry="26" fill="#f97316"/>
    <ellipse cx="60" cy="62" rx="28" ry="22" fill="#fb923c"/>
    <!-- Eyes stalks -->
    <ellipse cx="48" cy="38" rx="4" ry="10" fill="#f97316" transform="rotate(-10 48 38)"/>
    <ellipse cx="72" cy="38" rx="4" ry="10" fill="#f97316" transform="rotate(10 72 38)"/>
    <!-- Eyes -->
    <circle cx="48" cy="30" r="5" fill="#1a1a1a"/>
    <circle cx="72" cy="30" r="5" fill="#1a1a1a"/>
    <circle cx="49" cy="29" r="2" fill="#fff"/>
    <circle cx="73" cy="29" r="2" fill="#fff"/>
    <!-- Mouth -->
    <path d="M52 72 Q60 78 68 72" stroke="#c2410c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Claws left -->
    <ellipse cx="20" cy="60" rx="14" ry="10" fill="#f97316"/>
    <path d="M12 55 Q8 50 14 48" stroke="#f97316" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M12 55 Q6 58 10 62" stroke="#f97316" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Claws right -->
    <ellipse cx="100" cy="60" rx="14" ry="10" fill="#f97316"/>
    <path d="M108 55 Q112 50 106 48" stroke="#f97316" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M108 55 Q114 58 110 62" stroke="#f97316" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="35" y1="78" x2="22" y2="92" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="82" x2="32" y2="96" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <line x1="85" y1="78" x2="98" y2="92" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <line x1="78" y1="82" x2="88" y2="96" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="44" cy="67" r="6" fill="#fdba74" opacity="0.5"/>
    <circle cx="76" cy="67" r="6" fill="#fdba74" opacity="0.5"/>
  </g>
</svg>
